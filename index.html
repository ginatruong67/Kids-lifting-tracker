<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F6C6C">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tyler's Lifts">
  <title>Tyler's Lifts</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to the plan</a>
  <header class="top">
    <div class="brand">
      <img src="icons/icon-192.png" alt="" width="40" height="40">
      <div>
        <p class="hey" id="hey">Hey, champ!</p>
        <h1 id="appTitle">Kid's Lifts</h1>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="App sections">
      <button class="tab is-on" data-view="today" role="tab" aria-selected="true">Today</button>
      <button class="tab" data-view="plan" role="tab" aria-selected="false">12 weeks</button>
      <button class="tab" data-view="ten" role="tab" aria-selected="false">Tyler's Ten</button>
      <button class="tab" data-view="safety" role="tab" aria-selected="false">Safety</button>
    </nav>
  </header>

  <main id="main">
    <section id="view-safety" class="view" hidden></section>
    <section id="view-today" class="view"></section>
    <section id="view-plan" class="view" hidden></section>
    <section id="view-ten" class="view" hidden></section>
    <section id="view-session" class="view" hidden></section>
  </main>

  <dialog id="safety-gate" class="gate">
    <div class="gate-card">
      <p class="eyebrow">Safety First</p>
      <h2 id="gate-title">Read this with a grown-up before you lift</h2>
      <ol id="gate-list" class="safety-list"></ol>
      <label class="ack">
        <input type="checkbox" id="gate-check">
        <span>We read the safety rules together.</span>
      </label>
      <button type="button" id="gate-go" class="btn primary" disabled>Let's go!</button>
    </div>
  </dialog>


  <dialog id="how-guide" class="gate" data-testid="how-guide">
    <div class="gate-card how-card">
      <p class="eyebrow">How?</p>
      <h2 id="how-title"></h2>
      <img id="how-image" alt="" class="how-img" data-testid="how-image">
      <ol id="how-cues" class="how-cues"></ol>
      <a id="how-video" class="btn ghost" data-testid="watch-how" target="_blank" rel="noopener noreferrer" hidden>Watch how</a>
      <button type="button" id="how-close" class="btn primary">Got it</button>
    </div>
  </dialog>

  <p class="footer" id="footer"></p>
  <script src="app.js" type="module"></script>
</body>
</html>
